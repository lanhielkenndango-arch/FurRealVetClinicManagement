    <rect class="head head-gui" width="280" height="38"/>
    <text x="140" y="25" text-anchor="middle" class="class-name">FurRealVetClinicManagement</text>
    <line x1="0" y1="38" x2="280" y2="38" stroke="#9333ea"/>
