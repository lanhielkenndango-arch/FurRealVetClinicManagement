  <g transform="translate(80 1110)">
    <rect class="box box-util" width="310" height="125"/>
    <rect class="head head-util" width="310" height="38"/>
    <text x="155" y="25" text-anchor="middle" class="class-name">ValidationUtil</text>
    <line x1="0" y1="38" x2="310" y2="38" stroke="#ea580c"/>
    <text x="14" y="66" class="member">+ clean(...): String</text>
    <text x="14" y="88" class="member">+ hasBlank(...): boolean</text>
    <text x="14" y="110" class="member">+ isValidEmail(...): boolean</text>
  </g>

  <g transform="translate(430 1110)">
    <rect class="box box-util" width="310" height="125"/>
    <rect class="head head-util" width="310" height="38"/>
    <text x="155" y="25" text-anchor="middle" class="class-name">PhoneNumberUtil</text>
    <line x1="0" y1="38" x2="310" y2="38" stroke="#ea580c"/>
    <text x="14" y="66" class="member">+ applyPhoneMask(...)</text>
    <text x="14" y="88" class="member">+ format(...): String</text>
    <text x="14" y="110" class="member">+ isValidPhilippineMobile()</text>
  </g>

  <g transform="translate(780 1110)">
